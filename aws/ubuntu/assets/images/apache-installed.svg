<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780"><rect width="100%" height="100%" fill="#f4f6f8"/><rect x="60" y="50" width="1280" height="680" rx="18" fill="white" stroke="#d8dee8"/><text x="100" y="135" font-family="Arial" font-size="36" font-weight="bold">Apache2 — Installation</text><rect x="100" y="190" width="1200" height="380" rx="12" fill="#15171b"/><text x="130" y="250" font-family="monospace" font-size="24" fill="#7ee787">$ sudo apt install apache2</text><text x="130" y="310" font-family="monospace" font-size="22" fill="white">apache2 is already the newest version.</text><text x="130" y="380" font-family="monospace" font-size="24" fill="#7ee787">$ systemctl status apache2</text><text x="130" y="430" font-family="monospace" font-size="24" fill="#7ee787">● apache2.service — active (running)</text></svg>