<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#111827"/><text x="70" y="75" fill="white" font-family="monospace" font-size="30" font-weight="bold">Connexion SSH — Ubuntu EC2</text><rect x="70" y="120" width="1060" height="450" rx="14" fill="#1f2937"/><g fill="#d1d5db" font-family="monospace" font-size="23"><text x="105" y="175">$ chmod 400 mykey.pem</text><text x="105" y="225">$ ssh -i mykey.pem ubuntu@PUBLIC_IP</text><text x="105" y="275">The authenticity of host ... can't be established.</text><text x="105" y="325">Are you sure you want to continue connecting? yes</text><text x="105" y="390">Welcome to Ubuntu Server LTS</text><text x="105" y="440">ubuntu@ip-10-0-1-25:~$</text><text x="105" y="500">SSH opérationnel — serveur prêt à administrer</text></g></svg>