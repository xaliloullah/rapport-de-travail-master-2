<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8f9fa"/><text x="70" y="75" font-family="Arial" font-size="32" font-weight="bold">Validation AWS CLI et identité IAM</text><rect x="70" y="120" width="1060" height="440" rx="14" fill="#111827"/><g fill="#e5e7eb" font-family="monospace" font-size="23"><text x="105" y="185">$ aws --version</text><text x="105" y="225">aws-cli/2.x Python/3.x Linux/x86_64</text><text x="105" y="295">$ aws sts get-caller-identity</text><text x="105" y="335">{</text><text x="135" y="375">"UserId": "...",</text><text x="135" y="415">"Account": "...",</text><text x="135" y="455">"Arn": "arn:aws:iam::...:role/EC2Role"</text><text x="105" y="495">}</text></g><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="21">Identité temporaire du rôle EC2 validée</text></svg>