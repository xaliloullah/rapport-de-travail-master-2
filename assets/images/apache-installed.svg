<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#111827"/><text x="60" y="70" fill="white" font-family="monospace" font-size="32" font-weight="bold">Installation et démarrage d’Apache HTTP Server</text><g fill="#e5e7eb" font-family="monospace" font-size="22"><text x="70" y="150">$ sudo dnf install -y httpd</text><text x="70" y="205">$ sudo systemctl enable --now httpd</text><text x="70" y="260">$ systemctl is-active httpd</text><text x="70" y="315">active</text><text x="70" y="390">$ ss -lntp | grep ':80'</text><text x="70" y="445">LISTEN ... 0.0.0.0:80 ... httpd</text><text x="70" y="520">Serveur HTTP opérationnel</text></g></svg>