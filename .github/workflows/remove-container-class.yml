name: Remove container classes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove class="container" from every index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('index.html'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('class="container"', '')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Modified:', *changed, sep='\n- ')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No class=\"container\" found."
            exit 0
          fi
          git add -- '**/index.html'
          git commit -m "Remove container class from report indexes"
          git push
